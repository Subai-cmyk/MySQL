<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录 - 图书系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 400px; padding: 20px; }
    </style>
</head>
<body>
<div class="card shadow">
    <h3 class="text-center mb-4">📚 智能图书系统</h3>

    <div id="login-box">
        <h5 class="text-primary">用户登录</h5>
        <div class="mb-3"><input type="text" id="l-user" class="form-control" placeholder="用户名"></div>
        <div class="mb-3"><input type="password" id="l-pass" class="form-control" placeholder="密码"></div>
        <button class="btn btn-primary w-100" onclick="doLogin()">登录</button>
        <div class="mt-3 text-center">
            <a href="#" onclick="toggleView()">没有账号？去注册</a>
        </div>
    </div>

    <div id="reg-box" style="display:none;">
        <h5 class="text-success">新用户注册</h5>
        <div class="mb-3"><input type="text" id="r-user" class="form-control" placeholder="设置用户名"></div>
        <div class="mb-3"><input type="password" id="r-pass" class="form-control" placeholder="设置密码"></div>
        <div class="mb-3">
            <select id="r-role" class="form-control">
                <option value="student">我是学生</option>
                <option value="admin">我是管理员 (测试用)</option>
            </select>
        </div>
        <button class="btn btn-success w-100" onclick="doRegister()">注册</button>
        <div class="mt-3 text-center">
            <a href="#" onclick="toggleView()">已有账号？去登录</a>
        </div>
    </div>
</div>

<script>
    function toggleView() {
        const l = document.getElementById('login-box');
        const r = document.getElementById('reg-box');
        if(l.style.display === 'none') { l.style.display = 'block'; r.style.display = 'none'; }
        else { l.style.display = 'none'; r.style.display = 'block'; }
    }

    function doRegister() {
        const u = document.getElementById('r-user').value;
        const p = document.getElementById('r-pass').value;
        const role = document.getElementById('r-role').value;
        if(!u || !p) return alert('请填写完整');

        fetch('/api/register', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p, role: role})
        }).then(r=>r.json()).then(d => {
            alert(d.message);
            if(d.success) toggleView();
        });
    }

    function doLogin() {
        const u = document.getElementById('l-user').value;
        const p = document.getElementById('l-pass').value;

        fetch('/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        }).then(r=>r.json()).then(d => {
            if(d.success) {
                location.href = d.role === 'admin' ? '/admin' : '/student';
            } else {
                alert(d.message);
            }
        });
    }
</script>
</body>
</html>
