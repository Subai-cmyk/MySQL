<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">📚 管理员: {{ username }}</span>
        <a href="/logout" class="btn btn-light btn-sm">退出登录</a>
    </div>
</nav>

<div class="container">

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header bg-info text-white">📊 图书库存与借阅统计 (按书名)</div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead><tr><th>书名</th><th>总库存</th><th>被借出</th><th>剩余</th></tr></thead>
                        <tbody id="overview-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header bg-warning text-dark">📋 当前借阅记录 (谁借了哪本)</div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead><tr><th>书名</th><th>借阅人</th><th>时间</th></tr></thead>
                        <tbody id="log-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <span>📖 所有图书列表 (明细)</span>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addBookModal">+ 上架新书</button>
        </div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead><tr><th>ID</th><th>书名</th><th>状态</th><th>当前持有人</th><th>操作</th></tr></thead>
                <tbody id="book-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addBookModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">上架新书</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="addBookForm">
                    <div class="mb-2"><label>书名</label><input type="text" class="form-control" name="title" required></div>
                    <div class="mb-2"><label>作者</label><input type="text" class="form-control" name="author" required></div>
                    <div class="mb-2"><label>类别</label><input type="text" class="form-control" name="genre" required></div>
                    <div class="mb-2"><label>价格</label><input type="number" class="form-control" name="price"></div>
                    <div class="mb-2"><label>评分</label><input type="number" class="form-control" name="rating" step="0.1"></div>
                </form>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-primary" onclick="submitBook()">保存</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() { loadDashboard(); loadBooks(); });

    // 加载统计数据
    function loadDashboard() {
        fetch('/api/admin/dashboard').then(res => res.json()).then(data => {
            // 1. 概览
            const overBody = document.getElementById('overview-body');
            overBody.innerHTML = '';
            data.overview.forEach(item => {
                overBody.innerHTML += `
                    <tr>
                        <td>${item.title}</td>
                        <td>${item.total}</td>
                        <td class="text-danger">${item.borrowed}</td>
                        <td class="text-success">${item.total - item.borrowed}</td>
                    </tr>`;
            });
            // 2. 借阅日志
            const logBody = document.getElementById('log-body');
            logBody.innerHTML = '';
            data.logs.forEach(log => {
                logBody.innerHTML += `
                    <tr>
                        <td>${log.title}</td>
                        <td><span class="badge bg-primary">${log.borrower}</span></td>
                        <td><small>${log.date}</small></td>
                    </tr>`;
            });
        });
    }

    // 加载所有图书列表
    function loadBooks() {
        fetch('/api/books').then(res => res.json()).then(data => {
            const tbody = document.getElementById('book-table-body');
            tbody.innerHTML = '';
            data.forEach(book => {
                let statusBadge = book.status === '可借阅' ? 'bg-success' : 'bg-secondary';
                let borrower = book.borrower_name ? `👤 ${book.borrower_name}` : '-';
                tbody.innerHTML += `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td><span class="badge ${statusBadge}">${book.status}</span></td>
                        <td>${borrower}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteBook(${book.id})">下架</button></td>
                    </tr>`;
            });
        });
    }

    function submitBook() {
        const formData = new FormData(document.getElementById('addBookForm'));
        fetch('/api/books', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(Object.fromEntries(formData.entries()))
        }).then(() => location.reload());
    }

    function deleteBook(id) {
        if(confirm('确定下架?')) fetch(`/api/books/${id}`, {method: 'DELETE'}).then(() => { loadDashboard(); loadBooks(); });
    }
</script>
</body>
</html>
